[build-system]
requires = ["setuptools>=62", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbm"
version = "0.1.0"
description = "Computational Brain/Behavior Modeling: MAP fitting, Bayesian model selection, and hierarchical Bayesian inference"
authors = [
    { name = "Payam Piray" },
    { name = "CBM contributors" },
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
]

[project.optional-dependencies]
display = ["matplotlib>=3.5"]
autodiff = ["jax>=0.4"]
dev = [
    "pytest>=7",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/payampiray/cbm_python"
Repository = "https://github.com/payampiray/cbm_python"
Issues = "https://github.com/payampiray/cbm_python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cbm", "cbm.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"