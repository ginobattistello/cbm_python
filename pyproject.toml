[build-system]
requires = ["setuptools>=62", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbm-local"
version = "0.1.0"
description = "Computational Bayesian Modeling (CBM) tools: individual fits, BMS, HBI"
authors = [{ name = "CBM Authors" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    # MODIFICATION 13 (DEV.md §16): result.table() returns DataFrames.
    # numpy/scipy were always required but were never declared here.
    "pandas>=1.3",
]

[project.optional-dependencies]
# MODIFICATION 14 (DEV.md §17): FitResult.plot(). Optional on purpose —
# cbm/display.py imports matplotlib lazily, so `import cbm` and every fit
# work without it; only calling plot() needs it.
display = ["matplotlib>=3.5"]

[project.urls]
Homepage = "https://example.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["cbm"]
