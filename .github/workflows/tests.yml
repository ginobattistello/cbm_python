name: tests

on:
  push:
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run fast tests
        run: |
          pytest -m "not slow and not jax"

  jax-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with JAX
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,autodiff]"

      - name: Run JAX tests
        run: |
          pytest -m "jax and not slow"

  scientific-regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install full test environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,autodiff]"

      - name: Run slow scientific regression tests
        run: |
          pytest -m "slow"
